name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck -s sh module/lib/common.sh module/*.sh module/META-INF/com/google/android/update-binary
          shellcheck -s bash tests/run.sh tools/build.sh

      - name: Tests
        run: bash tests/run.sh

      - name: Build
        run: bash tools/build.sh "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: zuxfree
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "ZUXFree ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --prerelease
